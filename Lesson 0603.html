<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 0603</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent2: #dc2626;
      --ink: #111827;
      --line: #d6dbe5;
      --paper: #ffffff;
      --bg: #f4f6f9;
      --text: #172033;
      --muted: #667085;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .deck {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background: var(--paper);
    }

    .slide {
      position: absolute;
      inset: 0;
      display: none;
      padding: 72px 76px 86px;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .slide.active {
      display: flex;
    }

    .slide-title {
      font-size: 54px;
      line-height: 1.12;
      margin: 0;
      letter-spacing: 0;
      font-weight: 900;
    }

    .slide-subtitle {
      margin: 20px 0 0;
      max-width: 980px;
      font-size: 28px;
      line-height: 1.42;
      color: var(--muted);
      font-weight: 600;
    }

    .title-slide {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .title-inner {
      max-width: 1120px;
    }

    .badges {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 18px;
      font-weight: 800;
      background: #fff;
    }

    .content-slide {
      flex-direction: column;
      justify-content: center;
    }

    .board-slide {
      padding: 32px;
      align-items: stretch;
      justify-content: stretch;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.08), transparent 26%),
        linear-gradient(135deg, #12372f 0%, #0f2d27 52%, #0b241f 100%);
    }

    .board-surface {
      position: relative;
      flex: 1;
      border: 12px solid #8b5a2b;
      border-radius: 10px;
      background:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.06), transparent 18%),
        #12372f;
      background-size: 56px 56px, 56px 56px, auto, auto;
      box-shadow:
        inset 0 0 42px rgba(0,0,0,0.36),
        0 18px 44px rgba(15,23,42,0.24);
      overflow: hidden;
    }

    .board-surface::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 78% 18%, rgba(255,255,255,0.09), transparent 10%),
        radial-gradient(circle at 18% 80%, rgba(255,255,255,0.07), transparent 14%);
      opacity: 0.7;
    }

    .content-list {
      margin: 34px 0 0;
      padding: 0;
      max-width: 1120px;
      list-style: none;
      display: grid;
      gap: 22px;
    }

    .content-list li {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 18px;
      align-items: start;
      font-size: 31px;
      line-height: 1.42;
      font-weight: 700;
    }

    .content-list li::before {
      content: "";
      width: 20px;
      height: 20px;
      margin-top: 13px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 9px rgba(37, 99, 235, 0.12);
    }

    .callout {
      width: fit-content;
      margin-top: 42px;
      padding: 20px 28px;
      border-left: 9px solid var(--accent2);
      background: #fff;
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    .interactive-slide {
      padding: 0;
      background: #f5f7fb;
    }

    .image-slide {
      padding: 0;
      background: #111827;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    .image-viewport.dragging {
      cursor: grabbing;
    }

    .image-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f8fafc;
      transform-origin: center center;
      will-change: transform;
    }

    .image-caption {
      position: absolute;
      left: 24px;
      top: 18px;
      max-width: calc(100% - 48px);
      padding: 9px 13px;
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.78);
      color: #fff;
      font-weight: 850;
      font-size: 16px;
      pointer-events: none;
    }

    .image-zoom-controls {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(17, 24, 39, 0.78);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .image-zoom-controls button {
      width: 38px;
      height: 34px;
      padding: 0;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      box-shadow: none;
    }

    .image-zoom-value {
      min-width: 56px;
      text-align: center;
      font-weight: 900;
      font-size: 14px;
    }

    .pdf-slide {
      padding: 0;
      background: #2f3540;
      flex-direction: column;
    }

    .pdf-toolbar {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(17, 24, 39, 0.78);
      color: #fff;
      backdrop-filter: blur(8px);
    }

    .pdf-toolbar button {
      min-width: 38px;
      height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      box-shadow: none;
      font-size: 14px;
    }

    .pdf-page-value,
    .pdf-zoom-value {
      min-width: 60px;
      text-align: center;
      font-weight: 900;
      font-size: 14px;
    }

    .pdf-canvas-wrap {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 58px 28px 78px;
    }

    .pdf-canvas-wrap.zoomed {
      align-items: flex-start;
      justify-content: flex-start;
    }

    .pdf-canvas {
      display: block;
      background: #fff;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
    }

    .pdf-loading {
      color: #fff;
      font-size: 20px;
      font-weight: 850;
    }

    .tool-slide {
      padding: 0;
      background: #fff;
      overflow: hidden;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .tool-stage {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #fff;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .tool-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
    }

    .tool-frame {
      width: 1366px;
      height: 768px;
      border: 0;
      background: #fff;
      display: block;
      transform-origin: top left;
    }

    .interactive-layout {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 360px;
    }

    .stage-wrap {
      position: relative;
      min-width: 0;
      background: radial-gradient(circle at center, #ffffff 0%, #eef2f7 100%);
      border-right: 1px solid var(--line);
    }

    .stage-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .panel {
      padding: 28px 24px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .panel p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      font-weight: 600;
    }

    .readout {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #fbfcfe;
    }

    .angle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 17px;
      font-weight: 800;
    }

    .angle-row:last-child {
      border-bottom: 0;
    }

    .center-label { color: var(--accent); }
    .inscribed-label { color: var(--accent2); }

    .angle-value {
      font-size: 25px;
      font-weight: 950;
      color: var(--text);
      white-space: nowrap;
    }

    .formula {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 25px;
      font-weight: 950;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
      background: var(--ink);
      color: white;
    }

    button.secondary {
      background: #e9edf5;
      color: var(--text);
    }

    button.active {
      background: var(--accent);
      color: #fff;
    }

    .proof-box {
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      background: #fff;
      font-size: 15px;
      line-height: 1.55;
      color: #334155;
      overflow: auto;
    }

    .proof-box.on {
      display: block;
    }

    .point {
      cursor: grab;
    }

    .point:active {
      cursor: grabbing;
    }

    .point-label,
    .math-label,
    .arc-label {
      font-weight: 950;
      paint-order: stroke;
      stroke: white;
      stroke-linejoin: round;
    }

    .point-label {
      font-size: 22px;
      fill: var(--text);
      stroke-width: 5px;
    }

    .math-label {
      font-size: 22px;
      stroke-width: 5px;
    }

    .arc-label {
      font-size: 18px;
      fill: #475467;
      stroke-width: 4px;
    }

    .toolbar {
      --toolbar-scale: 1;
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 50;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(8px);
      max-width: min(660px, calc(100vw - 36px));
      transform: scale(var(--toolbar-scale));
      transform-origin: bottom right;
    }

    .toolbar.dragging {
      cursor: grabbing;
    }

    .toolbar.toolbar-positioned {
      transform-origin: top left;
    }

    .toolbar-drag-handle {
      min-width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #dbe3ef;
      color: #111827;
      font-size: 18px;
      font-weight: 950;
      cursor: grab;
      touch-action: none;
    }

    .toolbar-drag-handle:active {
      cursor: grabbing;
    }

    .toolbar button {
      min-width: 46px;
      height: 44px;
      padding: 0 13px;
      border-radius: 8px;
      font-size: 15px;
      background: #111827;
      color: #fff;
    }

    .toolbar button.toolbar-drag-handle {
      min-width: 44px;
      padding: 0;
      background: #dbe3ef;
      color: #111827;
      cursor: grab;
    }

    .toolbar button.tool {
      background: #edf1f7;
      color: #111827;
    }

    .toolbar button.on {
      background: #f59e0b;
      color: #111827;
    }

    .toolbar button.zoom-tool {
      background: #e0f2fe;
      color: #075985;
    }

    .toolbar button.toolbar-size-tool {
      background: #dcfce7;
      color: #166534;
    }

    .slide-count {
      min-width: 76px;
      text-align: center;
      font-weight: 900;
      color: #334155;
      font-size: 15px;
    }

    .palette {
      display: flex;
      gap: 6px;
      padding-left: 4px;
      border-left: 1px solid var(--line);
    }

    .thickness {
      display: flex;
      gap: 6px;
      padding-left: 4px;
      border-left: 1px solid var(--line);
    }

    .thick-btn.selected {
      background: #111827;
      color: #fff;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      padding: 0;
      border: 3px solid white;
      outline: 1px solid #94a3b8;
      box-shadow: none;
      min-width: 0;
    }

    .color-btn.selected {
      outline: 3px solid #111827;
    }

    #inkCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 40;
      pointer-events: none;
      touch-action: none;
    }

    .ink-on #inkCanvas {
      pointer-events: auto;
    }

    @media (max-width: 980px) {
      .slide {
        padding: 56px 30px 86px;
      }

      .slide-title {
        font-size: 40px;
      }

      .slide-subtitle,
      .content-list li {
        font-size: 23px;
      }

      .interactive-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }

      .panel {
        max-height: 34vh;
        overflow: auto;
        border-top: 1px solid var(--line);
      }
    }

    @media print {
      body {
        overflow: visible;
      }

      .deck {
        height: auto;
      }

      .slide {
        position: relative;
        display: flex !important;
        page-break-after: always;
        width: 100vw;
        height: 100vh;
      }

      .toolbar,
      #inkCanvas {
        display: none;
      }
    }
  </style>
</head>

  <script>

    const PDFJS_RUNTIME = null;
    const slides = Array.from(document.querySelectorAll(".slide"));
    let currentSlide = 0;
    const deck = document.getElementById("deck");
    const slideCountEl = document.getElementById("slideCount");
    let lessonZoom = 1;
    let toolbarScale = 1;

    function activeSlide() {
      return slides[currentSlide];
    }

    function applyLessonZoom() {
      if (!deck) return;
      if (Math.abs(lessonZoom - 1) < 0.01) {
        deck.style.transform = "";
        deck.style.transformOrigin = "";
        deck.style.width = "";
        deck.style.height = "";
        return;
      }
      deck.style.transform = "scale(" + lessonZoom + ")";
      deck.style.transformOrigin = "top left";
      deck.style.width = (100 / lessonZoom) + "vw";
      deck.style.height = (100 / lessonZoom) + "dvh";
    }

    function clickIfPresent(slide, selector) {
      const button = slide?.querySelector(selector);
      if (!button) return false;
      button.click();
      return true;
    }

    function zoomOutLesson() {
      const slide = activeSlide();
      if (clickIfPresent(slide, "[data-pdf-zoom-out]")) return;
      if (clickIfPresent(slide, "[data-zoom-out]")) return;
      lessonZoom = Math.max(0.5, Math.round((lessonZoom - 0.1) * 100) / 100);
      applyLessonZoom();

    function initToolbarDrag() {
      const toolbar = document.querySelector(".toolbar");
      if (!toolbar) return;

      const handle = document.createElement("button");
      handle.type = "button";
      handle.id = "toolbarDragHandle";
      handle.className = "toolbar-drag-handle";
      handle.title = "툴바 이동";
      handle.textContent = "\u2195";
      toolbar.prepend(handle);

      let drag = null;
      let savedPosition = null;

      function clampPosition(left, top) {
        const margin = 8;
        const rect = toolbar.getBoundingClientRect();
        const maxLeft = Math.max(margin, window.innerWidth - rect.width - margin);
        const maxTop = Math.max(margin, window.innerHeight - rect.height - margin);
        return {
          left: Math.min(maxLeft, Math.max(margin, left)),
          top: Math.min(maxTop, Math.max(margin, top))
        };
      }

      function applyPosition(position) {
        savedPosition = clampPosition(position.left, position.top);
        toolbar.style.left = savedPosition.left + "px";
        toolbar.style.top = savedPosition.top + "px";
        toolbar.style.right = "auto";
        toolbar.style.bottom = "auto";
        toolbar.classList.add("toolbar-positioned");
      }

      function resetPosition() {
        savedPosition = null;
        toolbar.style.left = "";
        toolbar.style.top = "";
        toolbar.style.right = "";
        toolbar.style.bottom = "";
        toolbar.classList.remove("toolbar-positioned");
      }

      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const rect = toolbar.getBoundingClientRect();
        drag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          baseLeft: rect.left,
          baseTop: rect.top
        };
        toolbar.classList.add("dragging");
        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        applyPosition({
          left: drag.baseLeft + event.clientX - drag.startX,
          top: drag.baseTop + event.clientY - drag.startY
        });
      });

      function endDrag(event) {
        if (!drag || event.pointerId !== drag.pointerId) return;
        toolbar.classList.remove("dragging");
        try { handle.releasePointerCapture(event.pointerId); } catch (_) {}
        drag = null;
      }

      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);
      handle.addEventListener("dblclick", resetPosition);
      window.addEventListener("resize", () => {
        if (savedPosition) applyPosition(savedPosition);
      });
    }

    const inkCanvas = document.getElementById("inkCanvas");
    const inkCtx = inkCanvas.getContext("2d");

    function resizeInkCanvas() {
      const old = document.createElement("canvas");
      old.width = inkCanvas.width;
      old.height = inkCanvas.height;
      old.getContext("2d").drawImage(inkCanvas, 0, 0);
      inkCanvas.width = Math.floor(window.innerWidth * window.devicePixelRatio);
      inkCanvas.height = Math.floor(window.innerHeight * window.devicePixelRatio);
      inkCanvas.style.width = window.innerWidth + "px";
      inkCanvas.style.height = window.innerHeight + "px";
      inkCtx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      inkCtx.drawImage(old, 0, 0, old.width / window.devicePixelRatio, old.height / window.devicePixelRatio);
    }

    function pointerPos(event) {
      const rect = inkCanvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function updateInkButtons() {
      document.body.classList.toggle("ink-on", inkOn);
      inkToggle.classList.toggle("on", inkOn && inkMode === "pen");
      eraserToggle.classList.toggle("on", inkOn && inkMode === "eraser");

    }

    function drawStroke(stroke) {
      if (!stroke.points.length) return;
      inkCtx.save();
      inkCtx.globalCompositeOperation = stroke.mode === "eraser" ? "destination-out" : "source-over";
      inkCtx.beginPath();
      inkCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (let i = 1; i < stroke.points.length; i += 1) inkCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
      inkCtx.strokeStyle = stroke.mode === "eraser" ? "rgba(0, 0, 0, 1)" : stroke.color;
      inkCtx.lineWidth = stroke.width;
      inkCtx.lineCap = "round";
      inkCtx.lineJoin = "round";
      inkCtx.stroke();
      inkCtx.restore();
    }

    function redrawInk() {
      inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
      for (const stroke of strokes) drawStroke(stroke);
    }

    inkCanvas.addEventListener("pointerdown", (event) => {

        mode: inkMode,

        width: inkMode === "eraser" ? Math.max(18, inkWidth * 4) : inkWidth,
        points: [pointerPos(event)]
      };
      inkCanvas.setPointerCapture(event.pointerId);
    });

    inkCanvas.addEventListener("pointermove", (event) => {
      if (!drawing || !currentStroke) return;
      const p = pointerPos(event);
      currentStroke.points.push(p);
      redrawInk();
      drawStroke(currentStroke);
    });

    function finishStroke(event) {
      if (drawing && currentStroke) strokes.push(currentStroke);
      drawing = false;
      currentStroke = null;
      try { inkCanvas.releasePointerCapture(event.pointerId); } catch (_) {}
    }

    inkCanvas.addEventListener("pointerup", finishStroke);
    inkCanvas.addEventListener("pointercancel", (event) => {
      if (!drawing) return;
      finishStroke(event);

    function initToolFrames() {
      document.querySelectorAll(".tool-slide").forEach((slide) => {
        const stage = slide.querySelector("[data-tool-stage]");
        const canvas = slide.querySelector("[data-tool-canvas]");
        const frame = slide.querySelector(".tool-frame");
        if (!stage || !canvas || !frame) return;

        const baseWidth = 1366;
        const baseHeight = 768;

        function fit() {
          const availableWidth = Math.max(320, stage.clientWidth);
          const availableHeight = Math.max(240, stage.clientHeight);
          const scale = Math.max(0.35, Math.min(availableWidth / baseWidth, availableHeight / baseHeight));
          canvas.style.width = Math.ceil(baseWidth * scale) + "px";
          canvas.style.height = Math.ceil(baseHeight * scale) + "px";
          frame.style.width = baseWidth + "px";
          frame.style.height = baseHeight + "px";
          frame.style.transform = "scale(" + scale + ")";
        }

        slide.addEventListener("slideactive", fit);
        window.addEventListener("resize", fit);
        frame.addEventListener("load", fit);
        if (slide.classList.contains("active")) fit();
      });
    }

    function initImageZoom() {
      document.querySelectorAll(".image-slide").forEach((slide) => {
        const viewport = slide.querySelector("[data-image-viewport]");
        const image = slide.querySelector(".image-page");
        const value = slide.querySelector("[data-zoom-value]");
        if (!viewport || !image || !value) return;

        const state = { scale: 1, x: 0, y: 0, dragging: false, startX: 0, startY: 0, baseX: 0, baseY: 0 };

        function apply() {
          image.style.transform = "translate(" + state.x + "px, " + state.y + "px) scale(" + state.scale + ")";
          value.textContent = Math.round(state.scale * 100) + "%";
        }

        function setScale(nextScale) {
          state.scale = Math.max(1, Math.min(4, nextScale));
          if (state.scale === 1) {
            state.x = 0;
            state.y = 0;
          }
          apply();
        }

        slide.querySelector("[data-zoom-in]")?.addEventListener("click", () => setScale(state.scale + 0.25));
        slide.querySelector("[data-zoom-out]")?.addEventListener("click", () => setScale(state.scale - 0.25));
        slide.querySelector("[data-zoom-reset]")?.addEventListener("click", () => {
          state.scale = 1;
          state.x = 0;
          state.y = 0;
          apply();
        });

        viewport.addEventListener("wheel", (event) => {
          if (!event.ctrlKey) return;
          event.preventDefault();
          setScale(state.scale + (event.deltaY < 0 ? 0.18 : -0.18));
        }, { passive: false });

        viewport.addEventListener("pointerdown", (event) => {
          if (inkOn || state.scale <= 1) return;
          state.dragging = true;
          state.startX = event.clientX;
          state.startY = event.clientY;
          state.baseX = state.x;
          state.baseY = state.y;
          viewport.classList.add("dragging");
          viewport.setPointerCapture(event.pointerId);
        });

        viewport.addEventListener("pointermove", (event) => {
          if (!state.dragging) return;
          state.x = state.baseX + event.clientX - state.startX;
          state.y = state.baseY + event.clientY - state.startY;
          apply();
        });

        viewport.addEventListener("pointerup", (event) => {
          state.dragging = false;
          viewport.classList.remove("dragging");
          try { viewport.releasePointerCapture(event.pointerId); } catch (_) {}
        });

        apply();
      });
    }

    function base64ToUint8(base64) {
      const raw = atob(base64);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
      return bytes;
    }

    async function loadPdfJs() {
      if (!PDFJS_RUNTIME) return null;
      if (!pdfJsPromise) {
        pdfJsPromise = (async () => {
          const pdfCode = atob(PDFJS_RUNTIME.pdf);
          const workerCode = atob(PDFJS_RUNTIME.worker);
          const pdfUrl = URL.createObjectURL(new Blob([pdfCode], { type: "text/javascript" }));
          const workerUrl = URL.createObjectURL(new Blob([workerCode], { type: "text/javascript" }));
          const pdfjsLib = await import(pdfUrl);
          pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
          return pdfjsLib;
        })();
      }
      return pdfJsPromise;
    }

    function initPdfSlides() {
      document.querySelectorAll(".pdf-slide").forEach((slide) => {
        const dataScript = slide.querySelector('script[type="application/pdf-base64"]');
        const canvas = slide.querySelector("[data-pdf-canvas]");
        const wrap = slide.querySelector("[data-pdf-viewer]");
        const pageLabel = slide.querySelector("[data-pdf-page]");
        const zoomLabel = slide.querySelector("[data-pdf-zoom]");
        const loading = slide.querySelector(".pdf-loading");
        if (!dataScript || !canvas || !wrap) return;

        const state = { pdf: null, page: 1, zoom: 1, rendering: false, pending: false };
        const ctx = canvas.getContext("2d");

        async function render() {
          if (!slide.classList.contains("active")) return;
          if (!state.pdf || state.rendering) {
            state.pending = Boolean(state.pdf);
            return;
          }
          state.rendering = true;
          const page = await state.pdf.getPage(state.page);
          const baseViewport = page.getViewport({ scale: 1 });
          const availableWidth = Math.max(240, wrap.clientWidth - 56);
          const availableHeight = Math.max(240, wrap.clientHeight - 136);
          const fitScale = Math.min(availableWidth / baseViewport.width, availableHeight / baseViewport.height);
          const cssScale = fitScale * state.zoom;
          const dpr = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale: cssScale * dpr });
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          canvas.style.width = Math.ceil(viewport.width / dpr) + "px";
          canvas.style.height = Math.ceil(viewport.height / dpr) + "px";
          wrap.classList.toggle("zoomed", state.zoom > 1.02);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          await page.render({ canvasContext: ctx, viewport }).promise;
          if (pageLabel) pageLabel.textContent = state.page + " / " + state.pdf.numPages;
          if (zoomLabel) zoomLabel.textContent = Math.round(state.zoom * 100) + "%";
          if (loading) loading.style.display = "none";
          canvas.style.display = "block";
          state.rendering = false;
          if (state.pending) {
            state.pending = false;
            render();
          }
        }

        function setPage(nextPage) {
          if (!state.pdf) return;
          state.page = Math.max(1, Math.min(state.pdf.numPages, nextPage));
          render();
        }

        function setZoom(nextZoom) {
          state.zoom = Math.max(0.5, Math.min(4, nextZoom));
          if (zoomLabel) zoomLabel.textContent = Math.round(state.zoom * 100) + "%";
          render();
        }

        slide.querySelector("[data-pdf-prev]")?.addEventListener("click", () => setPage(state.page - 1));
        slide.querySelector("[data-pdf-next]")?.addEventListener("click", () => setPage(state.page + 1));
        slide.querySelector("[data-pdf-zoom-out]")?.addEventListener("click", () => setZoom(state.zoom - 0.25));
        slide.querySelector("[data-pdf-zoom-in]")?.addEventListener("click", () => setZoom(state.zoom + 0.25));
        slide.querySelector("[data-pdf-reset]")?.addEventListener("click", () => {
          state.zoom = 1;
          render();
        });
        wrap.addEventListener("wheel", (event) => {
          if (!event.ctrlKey) return;
          event.preventDefault();
          setZoom(state.zoom + (event.deltaY < 0 ? 0.18 : -0.18));
        }, { passive: false });
        slide.addEventListener("slideactive", () => {
          if (state.pdf) render();
        });

        loadPdfJs().then(async (pdfjsLib) => {
          if (!pdfjsLib) throw new Error("PDF.js runtime is missing");
          const bytes = base64ToUint8(dataScript.textContent.trim());
          state.pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
          if (pageLabel) pageLabel.textContent = state.page + " / " + state.pdf.numPages;
          if (zoomLabel) zoomLabel.textContent = Math.round(state.zoom * 100) + "%";
          render();
        }).catch((error) => {
          console.error(error);
          if (loading) loading.textContent = "PDF를 불러오지 못했습니다.";
        });

        window.addEventListener("resize", () => {
          if (state.pdf) render();
        });
      });
    }

    initCircleAngle();

    function initCircleAngle() {
      const svg = document.getElementById("circleSvg");
      if (!svg) return;
      const cx = 470, cy = 350, r = 215;
      const state = {
        a: degToRad(145),
        b: degToRad(35),
        p: degToRad(265),
        showAngles: true,
        sameArcMode: true,
        dragging: null
      };
      const byId = (id) => document.getElementById(id);
      const els = {
        Apoint: byId("Apoint"), Bpoint: byId("Bpoint"), Ppoint: byId("Ppoint"),
        Alabel: byId("Alabel"), Blabel: byId("Blabel"), Plabel: byId("Plabel"),
        OA: byId("OA"), OB: byId("OB"), PA: byId("PA"), PB: byId("PB"), AB: byId("AB"),
        minorArc: byId("minorArc"), centerAngleArc: byId("centerAngleArc"),
        inscribedAngleArc: byId("inscribedAngleArc"), centerAngleLabel: byId("centerAngleLabel"),
        inscribedAngleLabel: byId("inscribedAngleLabel"), arcText: byId("arcText"),
        centerValue: byId("centerValue"), inscribedValue: byId("inscribedValue"),
        formula: byId("formula"), proofBox: byId("proofBox")
      };

      function degToRad(deg) { return deg * Math.PI / 180; }
      function radToDeg(rad) { return rad * 180 / Math.PI; }
      function norm(angle) {
        while (angle < 0) angle += Math.PI * 2;
        while (angle >= Math.PI * 2) angle -= Math.PI * 2;
        return angle;
      }
      function pointOnCircle(angle) {
        return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
      }
      function setLine(line, p1, p2) {
        line.setAttribute("x1", p1.x);
        line.setAttribute("y1", p1.y);
        line.setAttribute("x2", p2.x);
        line.setAttribute("y2", p2.y);
      }
      function setPoint(circle, label, p, dx, dy) {
        circle.setAttribute("cx", p.x);
        circle.setAttribute("cy", p.y);
        label.setAttribute("x", p.x + dx);
        label.setAttribute("y", p.y + dy);
      }
      function arcPath(radius, start, end) {
        start = norm(start);
        end = norm(end);
        const delta = norm(end - start);
        const largeArc = delta > Math.PI ? 1 : 0;
        const p1 = { x: cx + radius * Math.cos(start), y: cy + radius * Math.sin(start) };
        const p2 = { x: cx + radius * Math.cos(end), y: cy + radius * Math.sin(end) };
        return "M " + p1.x + " " + p1.y + " A " + radius + " " + radius + " 0 " + largeArc + " 1 " + p2.x + " " + p2.y;
      }
      function angleBetweenSmall(a, b) {
        let diff = Math.abs(norm(a) - norm(b));
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        return diff;
      }
      function midAngleSmall(a, b) {
        a = norm(a);
        b = norm(b);
        let diff = norm(b - a);
        if (diff > Math.PI) diff -= Math.PI * 2;
        return norm(a + diff / 2);
      }
      function pointAngleFromSvg(event) {
        const pt = svg.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        return Math.atan2(p.y - cy, p.x - cx);
      }
      function nearestOppositeArcAngle(p, a, b) {
        p = norm(p);
        a = norm(a);
        b = norm(b);
        const ab = norm(b - a);
        const ba = norm(a - b);
        if (ab <= Math.PI) {
          const bp = norm(p - b);
          if (bp >= 0 && bp <= ba) return p;
          return norm(midAngleSmall(a, b) + Math.PI);
        }
        const ap = norm(p - a);
        if (ap >= 0 && ap <= ab) return p;
        return norm(midAngleSmall(a, b) + Math.PI);
      }
      function drawInscribedAngleArc(P, A, B, deg) {
        const v1 = Math.atan2(A.y - P.y, A.x - P.x);
        const v2 = Math.atan2(B.y - P.y, B.x - P.x);
        let diff = norm(v2 - v1);
        if (diff > Math.PI) diff -= Math.PI * 2;
        const radius = 52;
        const p1 = { x: P.x + radius * Math.cos(v1), y: P.y + radius * Math.sin(v1) };
        const p2 = { x: P.x + radius * Math.cos(v1 + diff), y: P.y + radius * Math.sin(v1 + diff) };
        const sweep = diff > 0 ? 1 : 0;
        els.inscribedAngleArc.setAttribute("d", "M " + p1.x + " " + p1.y + " A " + radius + " " + radius + " 0 0 " + sweep + " " + p2.x + " " + p2.y);
        const mid = v1 + diff / 2;
        els.inscribedAngleLabel.setAttribute("x", P.x + 80 * Math.cos(mid) - 22);
        els.inscribedAngleLabel.setAttribute("y", P.y + 80 * Math.sin(mid) + 8);
        els.inscribedAngleLabel.textContent = deg + "°";
      }
      function update() {
        if (state.sameArcMode) state.p = nearestOppositeArcAngle(state.p, state.a, state.b);
        const A = pointOnCircle(state.a);
        const B = pointOnCircle(state.b);
        const P = pointOnCircle(state.p);
        const O = { x: cx, y: cy };
        setPoint(els.Apoint, els.Alabel, A, -34, -18);
        setPoint(els.Bpoint, els.Blabel, B, 18, -18);
        setPoint(els.Ppoint, els.Plabel, P, 18, 28);
        setLine(els.OA, O, A);
        setLine(els.OB, O, B);
        setLine(els.PA, P, A);
        setLine(els.PB, P, B);
        setLine(els.AB, A, B);
        const centerAngle = angleBetweenSmall(state.a, state.b);
        const inscribedAngle = centerAngle / 2;
        const centerDeg = Math.round(radToDeg(centerAngle));
        const inscribedDeg = Math.round(radToDeg(inscribedAngle));
        const start = norm(state.a);
        const end = norm(state.b);
        let delta = norm(end - start);
        let arcStart = start, arcEnd = end;
        if (delta > Math.PI) {
          arcStart = end;
          arcEnd = start;
        }
        els.minorArc.setAttribute("d", arcPath(r, arcStart, arcEnd));
        els.centerAngleArc.setAttribute("d", arcPath(72, arcStart, arcEnd));
        const mid = midAngleSmall(state.a, state.b);
        els.arcText.setAttribute("x", cx + (r + 34) * Math.cos(mid) - 38);
        els.arcText.setAttribute("y", cy + (r + 34) * Math.sin(mid));
        els.centerAngleLabel.setAttribute("x", cx + 105 * Math.cos(mid) - 24);
        els.centerAngleLabel.setAttribute("y", cy + 105 * Math.sin(mid) + 8);
        els.centerAngleLabel.textContent = centerDeg + "°";
        drawInscribedAngleArc(P, A, B, inscribedDeg);
        [els.centerAngleArc, els.centerAngleLabel, els.inscribedAngleArc, els.inscribedAngleLabel].forEach((el) => {
          el.style.display = state.showAngles ? "" : "none";
        });
        els.centerValue.textContent = centerDeg + "°";
        els.inscribedValue.textContent = inscribedDeg + "°";
        els.formula.textContent = centerDeg + "° = " + inscribedDeg + "° × 2";
        els.proofBox.innerHTML = "<strong>증명 흐름</strong><br>OA = OP, OB = OP 이므로 삼각형 AOP와 BOP는 각각 이등변삼각형입니다.<br><br>따라서 밑각이 서로 같고, 중심각은 원주각을 이루는 두 조각의 외각 합으로 볼 수 있습니다.<br><br><strong>결론: ∠AOB = 2 × ∠APB</strong>";
      }
      ["dragA", "dragB", "dragP"].forEach((id) => {
        document.getElementById(id).addEventListener("pointerdown", (event) => {
          if (inkOn) return;
          state.dragging = id.replace("drag", "").toLowerCase();
          svg.setPointerCapture(event.pointerId);
        });
      });
      svg.addEventListener("pointermove", (event) => {
        if (!state.dragging || inkOn) return;
        const angle = norm(pointAngleFromSvg(event));
        if (state.dragging === "p" && state.sameArcMode) state.p = nearestOppositeArcAngle(angle, state.a, state.b);
        else state[state.dragging] = angle;
        update();
      });
      svg.addEventListener("pointerup", (event) => {
        state.dragging = null;
        try { svg.releasePointerCapture(event.pointerId); } catch (_) {}
      });
      document.getElementById("modeSameArc").addEventListener("click", () => {
        state.sameArcMode = !state.sameArcMode;
        document.getElementById("modeSameArc").classList.toggle("active", state.sameArcMode);
        document.getElementById("modeSameArc").textContent = state.sameArcMode ? "같은 호 유지" : "자유 이동";
        update();
      });
      document.getElementById("toggleAngles").addEventListener("click", () => {
        state.showAngles = !state.showAngles;
        document.getElementById("toggleAngles").textContent = state.showAngles ? "각도 표시 숨기기" : "각도 표시 보이기";
        update();
      });
      document.getElementById("toggleProof").addEventListener("click", () => {
        const box = document.getElementById("proofBox");
        box.classList.toggle("on");
        document.getElementById("toggleProof").classList.toggle("active", box.classList.contains("on"));
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        state.a = degToRad(145);
        state.b = degToRad(35);
        state.p = degToRad(265);
        update();
      });
      update();
    }
  
  </script>
</body>
</html>
